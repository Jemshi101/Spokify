<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#666; --line:#dcdce2; --btn:#f4f4f7; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1d22; --fg:#ececf0; --muted:#a0a0aa; --line:#3a3a44; --btn:#2a2a31; } }
  body { width: 300px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 14px; margin: 0 0 12px; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; }
  button { flex: 1; padding: 8px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--btn); color: var(--fg); cursor: pointer; font: inherit; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  select { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--btn); color: var(--fg); font: inherit; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #msg { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 16px; }
  .links { display: flex; justify-content: space-between; margin-top: 10px; }
  .links a { color: var(--accent); cursor: pointer; font-size: 12px; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
  <h1>Spokify</h1>
  <div class="row">
    <button id="readPage" class="primary">Read page</button>
    <button id="readSel">Read selection</button>
  </div>
  <div class="row" id="controls" hidden>
    <button id="prev">⏮</button>
    <button id="toggle">Pause</button>
    <button id="next">⏭</button>
    <button id="stop">Stop</button>
  </div>
  <label for="voice">Voice</label>
  <select id="voice"></select>
  <select id="systemVoice" hidden></select>
  <label for="speed">Speed <span id="speedVal"></span></label>
  <input id="speed" type="range" min="0.5" max="3" step="0.25">
  <label for="engine">Engine</label>
  <select id="engine"></select>
  <div id="msg"></div>
  <div class="hint">Tip: Alt+click any paragraph to start reading from there.</div>
  <div class="links"><a id="shortcuts">Keyboard shortcuts</a><a id="diag">Diagnostics</a></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
